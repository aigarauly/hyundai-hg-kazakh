name: Verify Kazakh localization

on:
  push:
    paths:
      - 'localization/**'
      - 'scripts/**'
      - '.github/workflows/verify-localization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate XML resources
        run: |
          if test -f localization/values-kk/strings.xml; then
            python3 scripts/validate_strings.py localization/values-kk/strings.xml
          else
            echo 'Kazakh XML not committed yet; skipping XML validation.'
          fi
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download baksmali with fallback
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p tools
          curl -fL --retry 2 -o tools/baksmali.jar 'https://github.com/baksmali/smali/releases/download/v3.0.10/baksmali-3.0.10-fat-release.jar' || \
          curl -fL --retry 2 -o tools/baksmali.jar 'https://repo.maven.apache.org/maven2/org/smali/baksmali/2.5.2/baksmali-2.5.2.jar'
          ls -lh tools/baksmali.jar
          java -jar tools/baksmali.jar --help
      - name: Upload baksmali artifact
        uses: actions/upload-artifact@v4
        with:
          name: baksmali-tool
          path: tools/baksmali.jar
          retention-days: 7
